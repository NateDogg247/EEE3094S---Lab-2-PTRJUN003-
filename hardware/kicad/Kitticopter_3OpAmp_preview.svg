<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<style>
text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:28px;font-weight:bold}.s{font-size:16px}
.w{stroke:#1e495f;stroke-width:3;fill:none}.c{stroke:#1e495f;stroke-width:2;fill:white}
.r{fill:white;stroke:#1e495f;stroke-width:2}.n{font-size:15px}.h{font-size:18px;font-weight:bold;fill:#087f73}
</style>
<text x="55" y="55" class="t">KITTICOPTER THREE-OP-AMP CONTROLLER — KiCad</text>
<text x="55" y="85" class="s">Kp ≈ 0.0143 V/V • LM741 ×3 • ±15 V • Vcommand ≈ 2.5 + 0.0143(Vref − Vsensor)</text>
<text x="220" y="135" class="h">U1: subtract ×0.01</text><text x="650" y="135" class="h">U2: gain ×1.47</text><text x="1030" y="135" class="h">U3: add +2.5 V</text>

<!-- U1 -->
<polygon points="370,190 370,330 500,260" class="c"/><text x="405" y="265" class="h">U1</text><text x="405" y="288" class="n">741</text>
<text x="350" y="220" class="n">+</text><text x="350" y="305" class="n">−</text>
<line x1="80" y1="215" x2="230" y2="215" class="w"/><rect x="230" y="203" width="90" height="24" class="r"/><text x="238" y="198" class="n">R1 100k</text><line x1="320" y1="215" x2="370" y2="215" class="w"/>
<text x="80" y="205" class="n">DAC-1 VREF</text>
<line x1="335" y1="215" x2="335" y2="165" class="w"/><rect x="323" y="120" width="24" height="45" class="r"/><text x="353" y="145" class="n">R2 1k → GND</text>
<line x1="80" y1="305" x2="230" y2="305" class="w"/><rect x="230" y="293" width="90" height="24" class="r"/><text x="238" y="288" class="n">R3 100k</text><line x1="320" y1="305" x2="370" y2="305" class="w"/>
<text x="80" y="295" class="n">DAC-0 VSENSE</text>
<line x1="500" y1="260" x2="565" y2="260" class="w"/>
<path d="M390 305 L390 355 L485 355 L485 260" class="w"/><rect x="412" y="343" width="55" height="24" class="r"/><text x="414" y="385" class="n">R4 1k</text>

<!-- U2 -->
<line x1="565" y1="260" x2="690" y2="260" class="w"/>
<polygon points="690,190 690,330 820,260" class="c"/><text x="725" y="265" class="h">U2</text><text x="725" y="288" class="n">741</text>
<text x="670" y="220" class="n">+</text><text x="670" y="305" class="n">−</text>
<line x1="820" y1="260" x2="900" y2="260" class="w"/>
<path d="M690 305 L640 305 L640 375" class="w"/><rect x="628" y="375" width="24" height="55" class="r"/><text x="660" y="405" class="n">R6 10k → GND</text>
<path d="M665 305 L665 345 L800 345 L800 260" class="w"/><rect x="710" y="333" width="65" height="24" class="r"/><text x="710" y="382" class="n">R5 4.7k</text>

<!-- U3 -->
<line x1="900" y1="215" x2="1010" y2="215" class="w"/><rect x="920" y="203" width="70" height="24" class="r"/><text x="918" y="195" class="n">R7 100k</text>
<polygon points="1010,190 1010,330 1140,260" class="c"/><text x="1045" y="265" class="h">U3</text><text x="1045" y="288" class="n">741</text>
<text x="990" y="220" class="n">+</text><text x="990" y="305" class="n">−</text>
<line x1="960" y1="215" x2="960" y2="160" class="w"/><rect x="948" y="115" width="24" height="45" class="r"/><text x="980" y="140" class="n">R8 100k → GND</text>
<line x1="1140" y1="260" x2="1360" y2="260" class="w"/><text x="1210" y="245" class="n">ADC-1 COMMAND</text>
<path d="M1010 305 L970 305 L970 355 L1110 355 L1110 260" class="w"/><rect x="1025" y="343" width="65" height="24" class="r"/><text x="1020" y="385" class="n">R10 100k</text>
<line x1="820" y1="520" x2="970" y2="520" class="w"/><rect x="855" y="508" width="75" height="24" class="r"/><text x="850" y="500" class="n">R9 100k</text><path d="M970 520 L970 305" class="w"/>

<!-- bias -->
<text x="190" y="480" class="h">Bias potentiometer</text>
<text x="210" y="515" class="n">GND</text><line x1="280" y1="510" x2="280" y2="550" class="w"/><rect x="268" y="550" width="24" height="60" class="r"/><text x="305" y="585" class="n">R11 3.9k</text>
<line x1="280" y1="610" x2="280" y2="650" class="w"/><rect x="268" y="650" width="24" height="95" class="r"/><text x="305" y="700" class="n">P1 10k</text>
<path d="M245 650 L215 650 L215 745 L245 745" class="w"/><rect x="203" y="680" width="24" height="40" class="r"/><text x="125" y="705" class="n">R12 1.2k</text>
<line x1="280" y1="745" x2="280" y2="775" class="w"/><rect x="268" y="775" width="24" height="60" class="r"/><text x="305" y="810" class="n">R13 22k</text><text x="210" y="860" class="n">−15 V</text>
<line x1="280" y1="835" x2="280" y2="855" class="w"/>
<path d="M280 700 L820 700 L820 520" class="w"/><text x="495" y="690" class="n">WIPER</text>

<text x="740" y="650" class="h">Calibration</text>
<text x="740" y="680" class="n">1) VREF = VSENSE = 4.650 V</text>
<text x="740" y="710" class="n">2) Adjust P1 until COMMAND = +2.500 V</text>
<text x="740" y="740" class="n">3) Keep P1 fixed during tracking</text>
<text x="740" y="790" class="n">All three 741s: pin 7 = +15 V, pin 4 = −15 V</text>
<text x="740" y="820" class="n">100 nF from +15 V→GND and −15 V→GND at each op-amp</text>
</svg>